services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    environment:
      CHROMA_PERSIST_PATH: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - chroma-v1-data:/data
    restart: unless-stopped

  stream-job:
    profiles: ["jobs"]
    build:
      context: .
    depends_on:
      kafka:
        condition: service_healthy
      chroma:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
      - model-cache:/home/app/.cache/huggingface
      - ivy-cache:/home/app/.ivy2
    command: ["--help"]

volumes:
  kafka-data:
  chroma-v1-data:
  model-cache:
  ivy-cache:
